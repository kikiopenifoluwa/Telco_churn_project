<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Telco Customer Churn Prediction</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #333;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 40px auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            color: #1f3c88;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: bold;
            margin-bottom: 7px;
            color: #444;
        }

        input,
        select {
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            background: #fff;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #1f3c88;
            box-shadow: 0 0 3px rgba(31, 60, 136, 0.3);
        }

        .button-container {
            margin-top: 30px;
            text-align: center;
        }

        button {
            background: #1f3c88;
            color: white;
            border: none;
            padding: 13px 35px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #162d68;
        }

        .prediction {
            margin-top: 30px;
            padding: 18px;
            text-align: center;
            border-radius: 8px;
            background: #eef4ff;
            border: 1px solid #c8d8ff;
        }

        .prediction h2 {
            color: #1f3c88;
            margin-bottom: 8px;
        }

        .prediction-value {
            font-size: 20px;
            font-weight: bold;
        }

        @media (max-width: 700px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .container {
                width: 95%;
                padding: 20px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Telco Customer Churn Prediction</h1>

    <p class="subtitle">
        Enter customer information to predict whether the customer is likely to churn.
    </p>

    <form method="POST" action="/">

        <div class="form-grid">

            <!-- Gender -->
            <div class="form-group">
                <label for="gender">Gender</label>
                <select name="gender" id="gender" required>
                    <option value="">Select gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                </select>
            </div>

            <!-- Senior Citizen -->
            <div class="form-group">
                <label for="senior_citizen">Senior Citizen</label>
                <select name="senior_citizen" id="senior_citizen" required>
                    <option value="">Select</option>
                    <option value="0">No</option>
                    <option value="1">Yes</option>
                </select>
            </div>

            <!-- Partner -->
            <div class="form-group">
                <label for="partner">Partner?</label>
                <select name="Partner?" id="partner" required>
                    <option value="">Select</option>
                    <option value="Yes">Yes</option>
                    <option value="No">No</option>
                </select>
            </div>

            <!-- Dependents -->
            <div class="form-group">
                <label for="dependents">Dependents?</label>
                <select name="Dependents?" id="dependents" required>
                    <option value="">Select</option>
                    <option value="Yes">Yes</option>
                    <option value="No">No</option>
                </select>
            </div>

            <!-- Tenure -->
            <div class="form-group">
                <label for="tenure">Length of Customership (Months)</label>
                <input
                    type="number"
                    name="Length of Customership"
                    id="tenure"
                    min="0"
                    step="1"
                    placeholder="e.g. 24"
                    required
                >
            </div>

            <!-- Phone Service -->
            <div class="form-group">
                <label for="phone_service">Phone Service?</label>
                <select name="PhoneService?" id="phone_service" required>
                    <option value="">Select</option>
                    <option value="Yes">Yes</option>
                    <option value="No">No</option>
                </select>
            </div>

            <!-- Multiple Lines -->
            <div class="form-group">
                <label for="multiple_lines">Multiple Lines</label>
                <select name="Multiple_Lines" id="multiple_lines" required>
                    <option value="">Select</option>
                    <option value="Yes">Yes</option>
                    <option value="No">No</option>
                    <option value="No phone service">No phone service</option>
                </select>
            </div>

            <!-- Internet Service -->
            <div class="form-group">
                <label for="internet_service">Internet Service</label>
                <select name="Internet_Service" id="internet_service" required>
                    <option value="">Select</option>
                    <option value="DSL">DSL</option>
                    <option value="Fiber optic">Fiber optic</option>
                    <option value="No">No</option>
                </select>
            </div>

            <!-- Online Security -->
            <div class="form-group">
                <label for="online_security">Online Security</label>
                <select name="Online_Security" id="online_security" required>
                    <option value="">Select</option>
                    <option value="Yes">Yes</option>
                    <option value="No">No</option>
                    <option value="No internet service">No internet service</option>
                </select>
            </div>

            <!-- Online Backup -->
            <div class="form-group">
                <label for="online_backup">Online Backup</label>
                <select name="Online_backup" id="online_backup" required>
                    <option value="">Select</option>
                    <option value="Yes">Yes</option>
                    <option value="No">No</option>
                    <option value="No internet service">No internet service</option>
                </select>
            </div>

            <!-- Device Protection -->
            <div class="form-group">
                <label for="device_protection">Device Protection</label>
                <select name="Device_protection" id="device_protection" required>
                    <option value="">Select</option>
                    <option value="Yes">Yes</option>
                    <option value="No">No</option>
                    <option value="No internet service">No internet service</option>
                </select>
            </div>

            <!-- Tech Support -->
            <div class="form-group">
                <label for="tech_support">Tech Support</label>
                <select name="Tech_support" id="tech_support" required>
                    <option value="">Select</option>
                    <option value="Yes">Yes</option>
                    <option value="No">No</option>
                    <option value="No internet service">No internet service</option>
                </select>
            </div>

            <!-- Streaming TV -->
            <div class="form-group">
                <label for="streaming_tv">Streaming TV?</label>
                <select name="Streaming_TV?" id="streaming_tv" required>
                    <option value="">Select</option>
                    <option value="Yes">Yes</option>
                    <option value="No">No</option>
                    <option value="No internet service">No internet service</option>
                </select>
            </div>

            <!-- Streaming Movies -->
            <div class="form-group">
                <label for="streaming_movies">Streaming Movies?</label>
                <select name="Streaming_Movies?" id="streaming_movies" required>
                    <option value="">Select</option>
                    <option value="Yes">Yes</option>
                    <option value="No">No</option>
                    <option value="No internet service">No internet service</option>
                </select>
            </div>

            <!-- Contract -->
            <div class="form-group">
                <label for="contract">Contract Length</label>
                <select name="Contract_Length" id="contract" required>
                    <option value="">Select</option>
                    <option value="Month-to-month">Month-to-month</option>
                    <option value="One year">One year</option>
                    <option value="Two year">Two year</option>
                </select>
            </div>

            <!-- Monthly Charges -->
            <div class="form-group">
                <label for="monthly_charges">Monthly Charges</label>
                <input
                    type="number"
                    name="Monthly_Charges"
                    id="monthly_charges"
                    min="0"
                    step="0.01"
                    placeholder="e.g. 79.99"
                    required
                >
            </div>

            <!-- Total Charges -->
            <div class="form-group">
                <label for="total_charges">Total Charges</label>
                <input
                    type="number"
                    name="TotalCharges"
                    id="total_charges"
                    min="0"
                    step="0.01"
                    placeholder="e.g. 1919.76"
                    required
                >
            </div>

        </div>

        <div class="button-container">
            <button type="submit">
                Predict Churn
            </button>
        </div>

    </form>

    {% if prediction is not none %}
        <div class="prediction">
            <h2>Prediction Result</h2>

            <p class="prediction-value">
                {{ prediction }}
            </p>
        </div>
    {% endif %}

</div>

</body>
</html>
